# Baut eine unsignierte iOS-App-Datei (IPA) auf einem Mac von GitHub.
# Start von Hand: GitHub → Actions → „iOS-App bauen (unsigniert)“ → Run workflow.
# Ergebnis: Artefakt „content-hub-unsigned-ipa“ zum Herunterladen.
# Installation ohne Apple-Entwicklerkonto z. B. mit Sideloadly und normaler
# Apple-ID; die App läuft dann 7 Tage und muss danach neu installiert werden.
name: iOS-App bauen (unsigniert)

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Adresse des Servers, z. B. https://content-hub.example.com"
        required: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build ios --release --no-codesign --dart-define=BACKEND_URL=${{ inputs.backend_url }}
      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr content-hub-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: content-hub-unsigned-ipa
          path: app/content-hub-unsigned.ipa
